name: checks

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs on the same branch / PR when a new commit lands —
# there's no value in finishing the previous check against code that's
# already been superseded.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each entry becomes a separate status check on the PR. We don't
        # have lint/prettier scripts yet; add them here when they exist.
        script:
          - typecheck
          - test
          - build
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-dependencies

      - name: pnpm ${{ matrix.script }}
        run: pnpm ${{ matrix.script }}

  # Runtime gate: build the Prisma-on-D1 fixture and run it in workerd, asserting
  # the D1 route returns 200. Separate from the matrix because it's much slower
  # (real Next build + wrangler dev) and needs network. Catches runtime-only
  # regressions (e.g. the 0.2.13 minify break) that typecheck/test/build miss.
  prisma-d1-e2e:
    name: prisma-d1-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-dependencies

      - name: Prisma-on-D1 runtime gate
        run: e2e/prisma-d1/run.sh
